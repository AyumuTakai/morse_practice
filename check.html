<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>字句照合 - アマチュア無線 受験勉強</title>
    <meta name="theme-color" content="#778899" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="字句照合" />
    <link rel="manifest" href="manifests/check.webmanifest" />
    <link rel="apple-touch-icon" href="icons/check-180.png" />
    <link rel="stylesheet" href="assets/common.css" />
    <style>
      #check-view {
              max-width: 720px;
              margin: 0 auto;
              padding: 1em;
      
      }
      #check-view button {
              height: auto;
              font-size: 1rem;
              padding: 0.6em 1em;
              margin: 0 0.3em 0.5em 0;
              border-radius: 2em;
              border: 1px solid lightslategray;
              background-color: transparent;
              cursor: pointer;
      
      }
      #check-view button.active {
              background-color: lightslategray;
              color: white;
      
      }
      #check-view .card {
              background: white;
              border: 1px solid #ccc;
              border-radius: 1em;
              padding: 0.4em 1em;
      
      }
      #check-view .q {
              padding: 0.8em 0;
              border-bottom: 1px solid #e3e8ee;
      
      }
      #check-view .q:last-child {
              border-bottom: 0;
      
      }
      #check-view .label {
              font-weight: bold;
              margin-right: 0.5em;
      
      }
      #check-view .word {
              font-family: monospace;
              font-size: 1.4rem;
              letter-spacing: 0.15em;
      
      }
      #check-view .morse,
      #check-view .cols {
              display: flex;
              flex-wrap: wrap;
              gap: 0.3em 0.9em;
              margin: 0.4em 0;
              font-size: 1.1rem;
              letter-spacing: 0.1em;
      
      }
      #check-view .cols .col {
              text-align: center;
              padding: 0 0.3em;
              border-radius: 0.4em;
      
      }
      #check-view .cols .col .ch {
              display: block;
              font-family: monospace;
              font-weight: bold;
              letter-spacing: 0;
      
      }
      #check-view .cols .col.bad {
              background-color: #ffe0d6;
      
      }
      #check-view .choices button {
              border-radius: 0.8em;
              margin-bottom: 0.2em;
      
      }
      #check-view .choices button.picked {
              background-color: lightslategray;
              color: white;
      
      }
      #check-view .mark {
              font-weight: bold;
      
      }
      #check-view .mark.ok {
              color: #1a8f5a;
      
      }
      #check-view .mark.ng {
              color: #c0392b;
      
      }
      #check-view .fb {
              font-size: 0.9rem;
              color: #444;
      
      }
      #check-view .score {
              font-size: 1.2rem;
              margin: 0.5em 0;
      
      }
      #check-view .note {
              font-size: 0.85rem;
              color: #555;
      
      }
      #choice-view button { height:auto; font-size:1.05rem; padding:0.6em 1em; border-radius:0.8em; border:1px solid lightslategray; background:transparent; cursor:pointer; letter-spacing:0.08em; }
      #choice-view button.picked { background:#d8f0e4; border-color:#1a8f5a; color:#000; }
      #choice-view button.bad { background:#ffe0d6; border-color:#c0392b; color:#000; }
      #choice-view .word { font-family:monospace; font-size:1.5rem; letter-spacing:0.15em; }
      #choice-view .card { background:white; border:1px solid #ccc; border-radius:1em; padding:0.4em 1em; }
      #choice-view .score { font-size:1.1rem; margin:0.5em 0; }
      #choice-view .note { font-size:0.85rem; color:#555; }
      @media (max-width: 600px) {
        #check-view {
                  padding: 0.5em;
          
        }
      }
    </style>
    <link rel="stylesheet" href="tree.css" />
  </head>
  <body data-page="check.html">
    <header>
      <h1>字句照合</h1>
      <nav>
        <select id="page-select" aria-label="ページの切り替え"></select>
      </nav>
    </header>
    <p class="scope-note">対象: 1級=英字10字/英字5字+数字の○×、2級=英字9字の○×、3級=字句をモールス符号で表したものを選ぶ4択。4級では出題されません</p>
    <div id="grade-bar"></div>
    <div id="grade-none" class="not-in-grade" hidden>
      4級では、字句とモールス符号の照合は出題されません。3級・2級・1級を選ぶと練習できます。
    </div>
    <div id="choice-view" hidden style="max-width:720px;margin:0 auto;padding:1em">
      <p class="note">字句を、モールス符号で表したものを選びます(3級の形式)。</p>
      <div class="card"><div class="q">
        <div class="word" id="choice-word"></div>
        <div class="choices" id="choice-opts" style="display:grid;gap:0.4em;margin-top:0.6em"></div>
        <div class="fb" id="choice-fb"></div>
      </div></div>
      <div class="score" id="choice-score"></div>
      <button id="choice-next" hidden>次の問題</button>
    </div>
    <div id="check-view">
      <div class="toolbar" id="check-kinds">
        <button id="check-kind-10" class="active">英字10文字</button>
        <button id="check-kind-6">英字5文字+数字</button>
      </div>
      <p class="note">
        字句とモールス符号の組合せが、無線局運用規則 別表第1号に適合するか(1)、しないか(2)を答えます。
        5問のうち誤りはちょうど2問です。1級は英字10字または英字5字+数字、2級は英字9字です。
      </p>
      <div class="card" id="check-list"></div>
      <div class="score" id="check-score"></div>
      <div>
        <button id="check-submit">答え合わせ</button>
        <button id="check-next" hidden>次の5問</button>
      </div>
    </div>
    <script src="assets/common.js"></script>
    <script src="assets/tree-lib.js"></script>
    <script>

      // 字句照合: 過去問の B 問題と同じ形式(字句とモールス符号の組合せが適合するか)
      (() => {
        const $ = (id) => document.getElementById(id);
        const CODE = {};
        TREE_CODES.forEach(([ch, code]) => {
          if (/^[A-Z0-9]$/.test(ch)) CODE[ch] = code;
        });
        const LETTERS = Object.keys(CODE).filter((c) => /[A-Z]/.test(c));
        const DIGITS = Object.keys(CODE).filter((c) => /[0-9]/.test(c));
        const fmt = (code) => code.replace(/\./g, "・").replace(/-/g, "－");
        const rnd = (n) => Math.floor(Math.random() * n);
        const pick = (a) => a[rnd(a.length)];
        const KIND = { 10: { letters: 10, digit: false }, 9: { letters: 9, digit: false }, 6: { letters: 5, digit: true } };
        const grade = () => morseGrade.get() || 1;
        const NAMES = ["ア", "イ", "ウ", "エ", "オ"];
        // 符号の編集距離(1つ違いほど紛らわしい)
        const lev = (a, b) => {
          const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
          for (let j = 1; j <= b.length; j++) d[0][j] = j;
          for (let i = 1; i <= a.length; i++)
            for (let j = 1; j <= b.length; j++)
              d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
          return d[a.length][b.length];
        };
        const st = { kind: 10, items: [], submitted: false, ch: null, chTotal: 0, chOk: 0 };

        function makeItem(kind, wrong) {
          const k = KIND[kind];
          const chars = Array.from({ length: k.letters }, () => pick(LETTERS));
          if (k.digit) chars.push(pick(DIGITS));
          const shown = [...chars]; // 符号として表示する文字(誤りの問題では一部が違う)
          let fault = null;
          if (wrong) {
            const swaps = [];
            for (let i = 0; i + 1 < k.letters; i++) if (chars[i] !== chars[i + 1]) swaps.push(i);
            if (swaps.length && Math.random() < 0.3) {
              // 隣り合う2文字の符号が入れ替わっている
              const i = pick(swaps);
              [shown[i], shown[i + 1]] = [shown[i + 1], shown[i]];
              fault = { type: "swap", i };
            } else {
              // 似た符号の別の文字に取り違えている(1つ違いを優先)
              const i = rnd(chars.length);
              const pool = (/[0-9]/.test(chars[i]) ? DIGITS : LETTERS).filter((c) => c !== chars[i]);
              const d1 = pool.filter((c) => lev(CODE[c], CODE[chars[i]]) === 1);
              const d2 = pool.filter((c) => lev(CODE[c], CODE[chars[i]]) <= 2);
              shown[i] = pick(Math.random() < 0.5 && d1.length ? d1 : d2.length ? d2 : pool);
              fault = { type: "sub", i };
            }
          }
          return { chars, shown, fault, answer: null };
        }

        function newSet() {
          // 5問のうち誤りはちょうど2問(過去問と同じ)
          const wrong = new Set();
          while (wrong.size < 2) wrong.add(rnd(5));
          st.items = Array.from({ length: 5 }, (_, n) => makeItem(st.kind, wrong.has(n)));
          st.submitted = false;
          $("check-next").hidden = true;
          $("check-submit").hidden = false;
          $("check-score").textContent = "";
          render();
        }

        function render() {
          const list = $("check-list");
          list.replaceChildren();
          st.items.forEach((it, n) => {
            const q = document.createElement("div");
            q.className = "q";
            const word = document.createElement("div");
            const label = document.createElement("span");
            label.className = "label";
            label.textContent = NAMES[n];
            const w = document.createElement("span");
            w.className = "word";
            w.textContent = it.chars.join("");
            word.append(label, w);
            q.appendChild(word);

            if (!st.submitted) {
              // 解答前は符号だけを並べる(試験と同じ)
              const m = document.createElement("div");
              m.className = "morse";
              it.shown.forEach((c) => {
                const s = document.createElement("span");
                s.textContent = fmt(CODE[c]);
                m.appendChild(s);
              });
              q.appendChild(m);
            } else {
              // 解答後は、文字と符号を対応させて見せる
              const cols = document.createElement("div");
              cols.className = "cols";
              const bad = it.fault ? (it.fault.type === "swap" ? [it.fault.i, it.fault.i + 1] : [it.fault.i]) : [];
              it.shown.forEach((c, i) => {
                const col = document.createElement("span");
                col.className = "col" + (bad.includes(i) ? " bad" : "");
                const ch = document.createElement("span");
                ch.className = "ch";
                ch.textContent = it.chars[i];
                col.append(ch, document.createTextNode(fmt(CODE[c])));
                cols.appendChild(col);
              });
              q.appendChild(cols);
            }

            const choices = document.createElement("div");
            choices.className = "choices";
            [[1, "1 適合する"], [2, "2 適合しない"]].forEach(([v, text]) => {
              const b = document.createElement("button");
              b.textContent = text;
              b.disabled = st.submitted;
              if (it.answer === v) b.classList.add("picked");
              b.addEventListener("click", () => {
                it.answer = v;
                choices.querySelectorAll("button").forEach((x) => x.classList.remove("picked"));
                b.classList.add("picked");
              });
              choices.appendChild(b);
            });
            q.appendChild(choices);

            if (st.submitted) {
              const truth = it.fault ? 2 : 1;
              const ok = it.answer === truth;
              const mark = document.createElement("span");
              mark.className = "mark " + (ok ? "ok" : "ng");
              mark.textContent = ok ? "○ 正解" : it.answer ? "× 不正解" : "× 未回答";
              const fb = document.createElement("div");
              fb.className = "fb";
              if (!it.fault) fb.textContent = "すべて適合しています。";
              else if (it.fault.type === "swap") {
                const a = it.chars[it.fault.i], b = it.chars[it.fault.i + 1];
                fb.textContent = `「${a}」と「${b}」の符号の順序が入れ替わっています。`;
              } else {
                const a = it.chars[it.fault.i], s = it.shown[it.fault.i];
                fb.textContent = `「${a}」の符号は ${fmt(CODE[a])} ですが、表示されているのは「${s}」の符号 ${fmt(CODE[s])} です。`;
              }
              q.append(mark, fb);
            }
            list.appendChild(q);
          });
        }

        function submit() {
          st.submitted = true;
          // 誤りを見抜けたかを、誤りに関わる文字ごとに記録する(見抜けなければ、その文字と取り違えた文字の両方が苦手)
          st.items.forEach((it) => {
            if (!it.fault) return;
            const i = it.fault.i;
            const chars = it.fault.type === "swap" ? [it.chars[i], it.chars[i + 1]] : [it.chars[i], it.shown[i]];
            chars.forEach((c) => morseStats.record("c:" + c, it.answer === 2));
          });
          const score = st.items.filter((it) => it.answer === (it.fault ? 2 : 1)).length;
          $("check-score").textContent = `${score} / 5 問正解`;
          $("check-submit").hidden = true;
          $("check-next").hidden = false;
          render();
          $("check-score").scrollIntoView({ block: "nearest" });
        }

        // 3級: 字句をモールス符号で表したものを4択で選ぶ
        const ALL = Object.keys(CODE);
        function newChoice() {
          const n = 6 + rnd(3);
          const chars = Array.from({ length: n }, () => pick(ALL));
          const key = (cs) => cs.map((c) => CODE[c]).join(" ");
          const opts = [{ cs: chars, ok: true, changed: [] }];
          let guard = 0;
          while (opts.length < 4 && guard++ < 200) {
            const cs = [...chars];
            const changed = [];
            const cnt = 1 + rnd(2);
            for (let k = 0; k < cnt; k++) {
              const i = rnd(n);
              const pool = ALL.filter((c) => (/[0-9]/.test(c) === /[0-9]/.test(chars[i])) && c !== chars[i]);
              const near = pool.filter((c) => lev(CODE[c], CODE[chars[i]]) <= 1);
              cs[i] = pick(near.length ? near : pool);
              changed.push(i);
            }
            if (opts.some((o) => key(o.cs) === key(cs)) || key(cs) === key(chars)) continue;
            opts.push({ cs, ok: false, changed });
          }
          for (let i = opts.length - 1; i > 0; i--) {
            const j = rnd(i + 1);
            [opts[i], opts[j]] = [opts[j], opts[i]];
          }
          st.ch = { chars, opts, done: false };
          $("choice-word").textContent = chars.join("");
          $("choice-fb").textContent = "";
          $("choice-next").hidden = true;
          const box = $("choice-opts");
          box.replaceChildren();
          opts.forEach((o, i) => {
            const b = document.createElement("button");
            b.style.textAlign = "left";
            b.textContent = `${i + 1}  ${o.cs.map((c) => fmt(CODE[c])).join(" ")}`;
            b.addEventListener("click", () => {
              if (st.ch.done) return;
              st.ch.done = true;
              const ok = o.ok;
              st.chTotal++;
              if (ok) st.chOk++;
              // 取り違えやすかった文字を記録する(選んだ選択肢が誤りなら、その違いの文字が苦手)
              if (!ok) o.changed.forEach((idx) => morseStats.record("c:" + chars[idx], false));
              box.querySelectorAll("button").forEach((x, xi) => {
                x.disabled = true;
                if (opts[xi].ok) x.classList.add("picked");
              });
              if (!ok) b.classList.add("bad");
              $("choice-fb").textContent = ok ? "○ 正解" : "× 不正解(正解は " + (opts.findIndex((x) => x.ok) + 1) + ")";
              $("choice-score").textContent = `${st.chOk} / ${st.chTotal} 問正解`;
              $("choice-next").hidden = false;
            });
            box.appendChild(b);
          });
        }
        $("choice-next").addEventListener("click", newChoice);

        // 級に合わせて形式を切り替える
        function applyGrade() {
          const g = grade();
          $("grade-none").hidden = g !== 4;
          $("check-view").hidden = g === 4 || g === 3;
          $("choice-view").hidden = g !== 3;
          if (g === 3) {
            if (!st.ch) newChoice();
          } else if (g === 2) {
            $("check-kinds").hidden = true;
            st.kind = 9;
            newSet();
          } else if (g === 1) {
            $("check-kinds").hidden = false;
            if (st.kind === 9) st.kind = 10;
            [10, 6].forEach((x) => $("check-kind-" + x).classList.toggle("active", x === st.kind));
            newSet();
          }
        }

        $("check-submit").addEventListener("click", submit);
        $("check-next").addEventListener("click", newSet);
        [10, 6].forEach((k) =>
          $("check-kind-" + k).addEventListener("click", () => {
            st.kind = k;
            [10, 6].forEach((x) => $("check-kind-" + x).classList.toggle("active", x === k));
            newSet();
          })
        );
        window.checkInit = () => {
          morseGradeBar($("grade-bar"), applyGrade);
          applyGrade();
        };
      })();
    
      checkInit();
    </script>
  </body>
</html>
